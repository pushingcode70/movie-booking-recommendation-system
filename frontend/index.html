<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Booking & Recommendations</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Razorpay Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="#/" class="brand">Movie Booking</a>
      
      <!-- Global Search Bar in Header -->
      <div class="global-search-container">
        <input type="text" id="global-search-input" class="global-search-input" placeholder="Search movies..." autocomplete="off" />
        <div id="global-search-dropdown" class="global-search-dropdown" style="display: none;"></div>
      </div>

      <nav id="nav-links" class="nav-links">
        <!-- Dynamic Navigation Links rendered by app.js -->
      </nav>
    </div>
  </header>

  <main id="app" class="main-content">
    <!-- Dynamic View Container -->
  </main>

  <!-- Core Utility Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

  <!-- Feature Controller Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/home.js"></script>
  <script src="js/movies.js"></script>
  <script src="js/theatres.js"></script>
  <script src="js/booking.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
