<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{.Title}}</title>
</head>
<body style="font-family: Arial, sans-serif;">

    <h2>{{.Title}}</h2>

    <p>Hello,</p>

    <p>{{.Message}}</p>

    <div style="
        display:inline-block;
        padding:12px 24px;
        background:#f4f4f4;
        border:1px solid #ccc;
        font-size:28px;
        font-weight:bold;
        letter-spacing:4px;
        margin:20px 0;
    ">
        {{.OTP}}
    </div>

    <p>This OTP is valid for <strong>10 minutes</strong>.</p>

    <p>If you didn't request this, you can safely ignore this email.</p>

    <hr>

    <small>Movie Booking System</small>

</body>
</html>
